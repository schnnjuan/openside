[package]
name = "openside"
version = "0.1.0"
edition = "2021"
description = "A polished ratatui terminal interface for sideloading .ipas to your iPhone — ls/cd .ipa browser, expiry tracking, full English/pt-BR interface."
license = "MIT"
repository = "https://github.com/schnnjuan/openside"
readme = "README.md"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
